# Coolify deployment for job.ruilab.dev.
# Traffic arrives through the Cloudflare Tunnel on the external `edge` network via the
# `opportunity-desk` alias, so no host port is published. Secrets stay on the host in
# /opt/opportunity/.env; nothing sensitive lives in this file.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 512m
    env_file:
      - /opt/opportunity/.env
    volumes:
      - /opt/opportunity/attachments:/data/attachments
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      data: {}
      edge:
        aliases:
          - opportunity-desk

networks:
  data:
    external: true
  edge:
    external: true
